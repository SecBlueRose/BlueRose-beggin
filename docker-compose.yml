services:
  # Core API Server (Go)
  core-api:
    build:
      context: ./services/core-api
    ports:
      - "8080:8080"
    environment:
      - ENV=development

  # Security Engine (Python)
  sec-engine:
    build:
      context: ./services/sec-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ENV=development