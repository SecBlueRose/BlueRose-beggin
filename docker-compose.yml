services:
  # Core API Server (Go)
  core-api:
    build:
      context: ./services/core-api
    ports:
      - "8080:8080"
    environment:
      - ENV=development

  # Security Engine (Python)
  sec-engine:
    build:
      context: ./services/sec-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ENV=development
  # Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: aegis-db
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: hsrhi3rd*
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: